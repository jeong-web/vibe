<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>같이 꾸미는 다이어리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@400;700&family=Gamja+Flower&family=Gowun+Dodum&family=Hi+Melody&family=Nanum+Pen+Script&family=Poor+Story&display=swap">
<style>
/* Layout: a diary page. Calendar picker, friends and invites on the left; month, week or photo-diary spread on the right.
   Events are washi-tape bars, diary days are photos, friends' stickers sit on top. Templates rewrite the tokens below. */
:root {
  color-scheme: light;
  --paper: #fbfaf7;
  --dot: #d6d9ec;
  --surface: #ffffff;
  --ink: #2f2c3a;
  --muted: #7a7489;
  --line: #e7e3ec;
  --accent: #ff6f8e;
  --accent-soft: #ffe3ea;
  --on-accent: #ffffff;
  --sun: #e0506c;
  --sat: #4a78d0;
  --today: #fff3f6;
  --bar-ink: #2f2c3a;
  --shadow: 0 1px 2px rgba(47, 44, 58, .06), 0 8px 24px rgba(47, 44, 58, .06);
  --f-hand: "Gaegu", "Nanum Pen Script", "Malgun Gothic", cursive;
  --f-body: "Gowun Dodum", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #1d1c25; --dot: #33313f; --surface: #25242f; --ink: #eceaf3; --muted: #a29db3; --line: #363443;
    --accent: #ff8aa3; --accent-soft: #43283a; --sun: #ff8197; --sat: #86a9ff; --today: #2d2533;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #1d1c25; --dot: #33313f; --surface: #25242f; --ink: #eceaf3; --muted: #a29db3; --line: #363443;
  --accent: #ff8aa3; --accent-soft: #43283a; --sun: #ff8197; --sat: #86a9ff; --today: #2d2533;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background-color: var(--paper);
  background-image: radial-gradient(var(--dot) 1.1px, transparent 1.3px);
  background-size: 18px 18px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.6;
  padding-block: env(safe-area-inset-top, 0px) 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1240px; margin: 0 auto; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 24px; padding-block: 34px 22px; }
.title-wrap { position: relative; display: grid; gap: 2px; }
.tape {
  position: absolute; top: -14px; left: -10px; width: 118px; height: 24px;
  background: repeating-linear-gradient(45deg, var(--accent) 0 7px, var(--accent-soft) 7px 14px);
  transform: rotate(-4deg); opacity: .55; border-radius: 2px;
}
h1 { position: relative; margin: 0; font-family: var(--f-hand); font-weight: 700; font-size: clamp(34px, 6vw, 46px); line-height: 1.1; }
.proto { margin: 0; font-size: 13px; color: var(--muted); }
.proto b { color: var(--accent); font-weight: 400; }
.top-actions { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.viewer { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.viewer select { min-width: 170px; }

select, input[type="text"], input[type="date"], input[type="time"], textarea {
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0;
}
textarea { resize: vertical; min-height: 64px; }

.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px; align-items: start; }

/* Side */
.side { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; box-shadow: var(--shadow); }
.card.plain { background: transparent; border: 0; box-shadow: none; padding: 0 4px; }
.card.invite { border-color: var(--accent); }
.sh { margin: 0; font-family: var(--f-hand); font-weight: 700; font-size: 22px; line-height: 1.2; }
.sub { margin: 0; font-size: 12.5px; color: var(--muted); letter-spacing: .02em; }
.hint { margin: 0; font-size: 12.5px; color: var(--muted); }
.who { display: grid; gap: 4px; }
.who-btn { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; border: 0; background: transparent; text-align: left; }
.who-btn:hover, .who-btn.on { background: var(--accent-soft); }
.who-btn.on { font-weight: 700; }
.av {
  display: inline-grid; place-items: center; flex: none; width: 26px; height: 26px; border-radius: 50%;
  background: var(--a); color: #fff; font-size: 13px; font-family: var(--f-body); border: 2px solid var(--surface);
}
ul.req { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
ul.req li { display: flex; align-items: center; gap: 8px; }
ul.req li span { flex: 1; }
ul.req em { font-style: normal; font-size: 12px; color: var(--muted); }
ul.inv { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
ul.inv li { display: grid; grid-template-columns: 52px 1fr; gap: 4px 10px; align-items: start; }
ul.inv img { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; grid-row: span 3; }
ul.inv p { margin: 0; font-size: 13.5px; line-height: 1.45; }
ul.inv .row { display: flex; gap: 6px; }
.warn { color: var(--sun); font-size: 12px; }
.add { display: grid; gap: 6px; }
.add-row { display: flex; gap: 6px; }
.add-row input { flex: 1; }
ul.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
ul.legend li { display: flex; gap: 8px; align-items: center; }
ul.legend .pi { width: 14px; height: 14px; color: var(--muted); flex: none; }

/* Buttons */
.btn { border: 0; border-radius: 999px; padding: 8px 16px; background: var(--accent); color: var(--on-accent); font-weight: 700; white-space: nowrap; }
.btn:hover { filter: brightness(1.04); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
.btn.ghost:hover { border-color: var(--accent); }
.btn.sm { padding: 4px 12px; font-size: 13px; }
.btn.danger { background: transparent; color: var(--sun); border: 1.5px solid currentColor; }
.btn.danger.armed { background: var(--sun); color: #fff; }
.btn.icon { display: inline-flex; align-items: center; gap: 6px; }
.btn.icon svg { width: 16px; height: 16px; }
.link { border: 0; background: none; color: var(--accent); padding: 0; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; justify-self: start; }

/* One button that flips between the calendar and the diary */
.flip {
  display: inline-flex; align-items: center; gap: 7px; margin-right: 8px;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 14px; padding: 4px 12px 4px 10px;
  font-family: var(--f-hand); font-weight: 700; font-size: 22px; line-height: 1.2; box-shadow: var(--shadow);
}
.flip:hover { border-color: var(--accent); }
.flip svg { width: 17px; height: 17px; flex: none; }
.flip .ic { color: var(--accent); display: inline-flex; }
.flip .sw { color: var(--muted); width: 15px; height: 15px; }

/* Toolbar */
.main { display: grid; gap: 10px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.nav { display: flex; align-items: center; gap: 6px; }
.nav .arrow { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; }
.nav h2 { margin: 0 6px; font-family: var(--f-hand); font-weight: 700; font-size: 30px; line-height: 1; min-width: 7.2em; text-align: center; font-variant-numeric: tabular-nums; }
.tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 5px 14px; border-radius: 999px; font-size: 14px; }
.seg button.on { background: var(--ink); color: var(--surface); }
.ctx { margin: 0; font-size: 13.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; }

/* Month */
.month, .diary { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
.dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font-size: 12.5px; color: var(--muted); text-align: center; padding: 8px 0 6px; }
.dow .sun { color: var(--sun); } .dow .sat { color: var(--sat); }
.month, .diary { --row-h: 136px; }
.week { position: relative; height: var(--row-h); border-top: 1px solid var(--line); }
.days { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.day { position: relative; border-left: 1px solid var(--line); padding: 4px 7px; min-width: 0; }
.day:first-child { border-left: 0; }
.editable .day { cursor: pointer; }
.editable .day:hover { background: var(--today); }
.day.today { background: var(--today); }
.num { position: relative; display: inline-block; font-family: var(--f-hand); font-weight: 700; font-size: 19px; line-height: 1.2; min-width: 1.2em; text-align: center; font-variant-numeric: tabular-nums; }
.sun .num { color: var(--sun); } .sat .num { color: var(--sat); }
.day.out .num { opacity: .35; }
.ring { position: absolute; left: -11px; top: -6px; width: calc(100% + 22px); height: calc(100% + 12px); color: var(--accent); pointer-events: none; overflow: visible; }
.more { position: absolute; left: 4px; bottom: 3px; border: 0; background: none; font-size: 11.5px; color: var(--muted); padding: 0 3px; border-radius: 6px; }
.more:hover { color: var(--accent); }
.bars { position: absolute; left: 0; right: 0; top: 32px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 22px; row-gap: 5px; pointer-events: none; }

.bar, .blk {
  position: relative; border: 0; color: var(--bar-ink); pointer-events: auto;
  background-color: var(--c);
  background-image: repeating-linear-gradient(-45deg, rgba(255, 255, 255, .22) 0 4px, transparent 4px 9px);
  box-shadow: 0 1px 0 rgba(47, 44, 58, .08);
}
.bar { display: flex; align-items: center; gap: 3px; min-width: 0; margin: 0 3px; padding: 0 7px; border-radius: 7px; font-size: 12px; text-align: left; height: 22px; }
.bar.cl { margin-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; }
.bar.cr { margin-right: 0; border-top-right-radius: 0; border-bottom-right-radius: 0; }
.bar:hover, .blk:hover { filter: saturate(1.25) brightness(.98); }
.bt { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.bt b { font-weight: 700; font-variant-numeric: tabular-nums; }
.pi { width: 12px; height: 12px; flex: none; opacity: .55; }
.stks { position: absolute; right: -4px; top: -9px; display: flex; align-items: center; z-index: 2; pointer-events: none; }
.stks .stk { width: 21px; height: 21px; margin-left: -8px; }
.stks i { font-style: normal; font-size: 10px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 0 4px; margin-left: 1px; }
.stk { display: block; transform: rotate(var(--r, 0deg)); filter: drop-shadow(0 1px 1.2px rgba(0, 0, 0, .25)); overflow: visible; }

/* Week */
.wk-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.wk { min-width: 640px; }
.wk-row { display: grid; grid-template-columns: 54px repeat(7, minmax(0, 1fr)); }
.gut { font-size: 11.5px; color: var(--muted); text-align: right; padding: 6px 8px 0 0; }
.wh { text-align: center; padding: 8px 0 6px; border-left: 1px solid var(--line); font-size: 12.5px; color: var(--muted); display: grid; justify-items: center; }
.wh .num { font-size: 22px; color: var(--ink); }
.wh.sun span, .wh.sun .num { color: var(--sun); } .wh.sat span, .wh.sat .num { color: var(--sat); }
.wh.today { background: var(--today); }
.wk-all { border-top: 1px solid var(--line); }
.wk-all .ad { grid-column: 2 / -1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 5px; padding: 8px 0; min-height: 38px; }
.wk-body { max-height: 560px; overflow-y: auto; border-top: 1px solid var(--line); }
.wk-grid { height: calc(24 * 44px); }
.hours { position: relative; padding: 0; }
.hours span { position: absolute; right: 8px; transform: translateY(-50%); font-variant-numeric: tabular-nums; }
.hours span:first-child { display: none; }
.col { position: relative; border-left: 1px solid var(--line); background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px); background-size: 100% 44px; }
.editable .col { cursor: pointer; }
.col.today { background-color: var(--today); }
.blk { position: absolute; border-radius: 8px; padding: 3px 6px; font-size: 12px; line-height: 1.35; text-align: left; display: flex; align-items: flex-start; gap: 3px; overflow: visible; }
.blk .bt { white-space: normal; max-height: 100%; }
.now { position: absolute; left: 0; right: 0; height: 2px; background: var(--accent); z-index: 3; pointer-events: none; }
.now::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

/* Photo diary */
.dgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.dcell { position: relative; height: var(--row-h); border-left: 1px solid var(--line); border-top: 1px solid var(--line); min-width: 0; }
.dcell:nth-child(7n + 1) { border-left: 0; }
.dcell.out { opacity: .45; }
.dcell.today { background: var(--today); }
.dphoto { position: absolute; inset: 3px; border: 0; padding: 0; border-radius: 9px; overflow: hidden; background: var(--line); }
.dphoto img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s; }
.dphoto:hover img { transform: scale(1.03); }
.dnum { position: absolute; top: 6px; left: 7px; z-index: 2; font-family: var(--f-hand); font-weight: 700; font-size: 18px; line-height: 1.15; padding: 0 5px; border-radius: 8px; font-variant-numeric: tabular-nums; pointer-events: none; }
.has .dnum { background: var(--surface); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.dcell.sun .dnum { color: var(--sun); } .dcell.sat .dnum { color: var(--sat); }
.dnum.priv { display: inline-flex; align-items: center; gap: 3px; }
.dnum.priv svg { width: 12px; height: 12px; color: var(--ink); }
.pen {
  position: absolute; top: 7px; right: 7px; z-index: 3; width: 28px; height: 28px; border-radius: 50%; padding: 0;
  background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); display: grid; place-items: center;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .15);
}
.pen svg { width: 15px; height: 15px; }
.pen:hover, .pen.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.dco { position: absolute; left: 7px; bottom: 7px; display: flex; z-index: 2; pointer-events: none; }
.dco .av { width: 22px; height: 22px; font-size: 11px; margin-right: -7px; }
.dstk { position: absolute; right: 6px; bottom: 5px; display: flex; z-index: 2; pointer-events: none; }
.dstk .stk { width: 26px; height: 26px; margin-left: -9px; }
.dstk i { font-style: normal; font-size: 10px; background: var(--surface); border-radius: 8px; padding: 0 4px; align-self: center; margin-left: 2px; }
.dadd { position: absolute; inset: 3px; border: 1.5px dashed transparent; border-radius: 9px; background: none; color: var(--muted); font-size: 24px; opacity: 0; transition: opacity .15s; }
.dcell:hover .dadd, .dadd:focus-visible { opacity: 1; border-color: var(--line); }
@media (hover: none) { .dadd { opacity: .45; } }
.bubble {
  position: fixed; z-index: 60; max-width: 260px; background: var(--surface); color: var(--ink);
  border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; box-shadow: 0 10px 30px rgba(30, 25, 40, .22);
  display: grid; gap: 8px;
}
.bubble p { margin: 0; display: flex; gap: 8px; align-items: flex-start; font-family: var(--f-hand); font-size: 19px; line-height: 1.35; }
.bubble .av { width: 22px; height: 22px; font-size: 11px; margin-top: 2px; }
.bubble .empty { font-family: var(--f-body); font-size: 13px; color: var(--muted); }

/* Dialogs */
dialog { border: 0; border-radius: 20px; padding: 0; width: min(460px, calc(100vw - 32px)); max-height: calc(100vh - 32px); background: var(--surface); color: var(--ink); box-shadow: 0 24px 60px rgba(30, 25, 40, .3); overflow: auto; }
dialog.wide { width: min(620px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(30, 25, 40, .38); }
.dlg { padding: 22px; display: grid; gap: 14px; }
.dlg h3 { margin: 0; font-family: var(--f-hand); font-weight: 700; font-size: 28px; line-height: 1.2; text-wrap: balance; }
.dlg h4 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 400; letter-spacing: .02em; }
.dlg p { margin: 0; }
.dt-strip { height: 14px; margin: -22px -22px 4px; background-color: var(--c); background-image: repeating-linear-gradient(-45deg, rgba(255, 255, 255, .25) 0 5px, transparent 5px 11px); }
.dt-photo { margin: -22px -22px 0; background: var(--line); }
.dt-photo img { display: block; width: 100%; max-height: 56vh; object-fit: cover; }
.dt-owner { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); flex-wrap: wrap; }
.dt-owner .avs { display: flex; }
.dt-owner .avs .av { margin-right: -6px; }
.dt-title.muted { color: var(--muted); font-size: 22px; }
.dt-when { font-variant-numeric: tabular-nums; }
.dt-memo { background: var(--paper); border-radius: 10px; padding: 10px 12px; font-size: 14px; white-space: pre-wrap; }
.dt-lines { display: grid; gap: 8px; }
.dt-lines p { display: flex; gap: 8px; align-items: flex-start; font-family: var(--f-hand); font-size: 22px; line-height: 1.3; }
.dt-lines .av { margin-top: 3px; }
.dt-priv { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); }
.dt-priv .pi { width: 15px; height: 15px; margin-top: 3px; opacity: .8; }
.dt-stk { display: grid; gap: 10px; border-top: 1.5px dashed var(--line); padding-top: 14px; }
ul.stk-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px 14px; }
ul.stk-list li { display: flex; align-items: center; gap: 8px; }
ul.stk-list li span { display: grid; font-size: 13.5px; line-height: 1.3; }
ul.stk-list small { color: var(--muted); font-size: 11.5px; }
.stk.lg { width: 38px; height: 38px; }
.stk.xl { width: 46px; height: 46px; }
.x { border: 0; background: none; color: var(--muted); font-size: 12px; text-decoration: underline; padding: 0; }
.picker { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.pk { border: 1.5px solid transparent; background: var(--paper); border-radius: 14px; padding: 8px 2px 6px; display: grid; justify-items: center; gap: 2px; font-size: 12px; }
.pk:hover { border-color: var(--line); }
.pk.on { border-color: var(--accent); background: var(--accent-soft); }
.empty { font-size: 13.5px; color: var(--muted); }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.dlg-actions .spacer { flex: 1; }

/* Forms */
.field { display: grid; gap: 5px; }
.field > label, .field > .lb { font-size: 13px; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatches input, .privs input { position: absolute; opacity: 0; pointer-events: none; }
.swatches label { width: 30px; height: 30px; border-radius: 50%; background: var(--c); border: 2px solid transparent; box-shadow: inset 0 0 0 2px var(--surface); }
.swatches input:checked + label { border-color: var(--ink); }
.swatches input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
.privs { display: grid; gap: 6px; }
.privs label { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; padding: 9px 12px; }
.privs label b { font-weight: 700; font-size: 14px; }
.privs label small { grid-column: 1; color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.privs .pv { grid-column: 2; grid-row: 1 / span 2; width: 64px; height: 18px; border-radius: 5px; border: 1.5px dashed var(--line); display: flex; align-items: center; padding: 0 5px; font-size: 10px; color: var(--bar-ink); overflow: hidden; white-space: nowrap; }

@keyframes pop { 0% { transform: scale(.2) rotate(-40deg); } 65% { transform: scale(1.2) rotate(calc(var(--r, 0deg) + 6deg)); } 100% { transform: scale(1) rotate(var(--r, 0deg)); } }

<body>
<div id="stk-defs"></div>
<div class="wrap">

          <button class="arrow" data-nav="-1" aria-label="이전">‹</button>
          <h2 id="period"></h2>
          <button class="arrow" data-nav="1" aria-label="다음">›</button>

<script>
(() => {
  const STORE = 'sticker-diary-v1';
  const DAY = ['일', '월', '화', '수', '목', '금', '토'];
  const HOUR = 44;

    sky: ['하늘', '#a7d8ff'], lavender: ['라벤더', '#cdb4ff'], lilac: ['라일락', '#f4c2e6'], sand: ['모래', '#ddd6cc']
  };
  const PRIV = {
    private: { name: '비공개', desc: '나만 볼 수 있어요. 친구 달력에는 나타나지 않아요.' },
    bar: { name: '막대만 공개', desc: '친구에게는 색 막대만 보여요. 제목·시간·메모는 숨겨져요.' },
    public: { name: '내용 공개', desc: '친구에게 제목, 시간, 메모까지 보여요.' }
  };

  /* ---------- Sticker packs ---------- */
  const circ = (cx, cy, r) => `M${cx - r} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`;

    return `<li><button class="ag${lv === 'bar' ? ' only' : ''}" data-ev="${e.id}" style="--c:${COLORS[e.color][1]}" aria-label="${esc(aria)}"><span class="ag-bar"></span>${body}${own && e.privacy !== 'public' ? ICON[e.privacy] : ''}${stickerRow(e, 'ag-stk')}</button></li>`;
  }
  function dayBlock(ds, cls, title) {
    const list = dayEvents(ds), own = ui.owner === ui.viewer;

  }
  function renderWeekList() {
    const c = parse(ui.cursor), ws = addDays(ui.cursor, -c.getDay());

      const ds = addDays(ws, i), d = parse(ds);
      h += dayBlock(ds, 'wday', `<span class="${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${DAY[i]}</span> ${d.getMonth() + 1}월 ${d.getDate()}일`);
    }
    return h + '</div>';
  }

  /* ---------- Photo diary ---------- */
  function renderDiary() {
    const { m, start, end } = monthRange();

    let h = `<div class="diary">${dowRow()}<div class="dgrid">`;
    for (let ds = start; ds <= end; ds = addDays(ds, 1)) {

      const locked = e && e.privacy === 'private';
      const cls = ['dcell', d.getMonth() !== m ? 'out' : '', i === 0 ? 'sun' : i === 6 ? 'sat' : '', ds === today ? 'today' : '', e ? 'has' : '', locked ? 'locked' : ''].filter(Boolean).join(' ');
      h += `<div class="${cls}">`;
      if (e) {
        h += `<button class="dphoto" data-diary="${e.id}" aria-label="${dLabel(ds)} 일기 사진 크게 보기"><img src="${photoSrc(e.photo)}" alt="" loading="lazy"></button>`;
        h += `<button class="pen${ui.bubble === e.id ? ' on' : ''}" data-pen="${e.id}" aria-label="${dLabel(ds)} 한 줄 일기 보기" aria-expanded="${ui.bubble === e.id}">${PEN}</button>`;

      }

        : `<span class="dnum">${d.getDate()}</span></div>`;
    }
    return h + '</div></div>';
  }
  function showBubble(id, btn) {
    const e = S.diaries.find(x => x.id === id); if (!e) return;
    const el = $('bubble');

  }
  function hideBubble() {
    if (!ui.bubble) return;

    document.querySelectorAll('.pen.on').forEach(p => { p.classList.remove('on'); p.setAttribute('aria-expanded', 'false'); });
  }

  /* ---------- Render ---------- */
  const $ = id => document.getElementById(id);
  function renderViewerSel() {
    $('viewerSel').innerHTML = S.users.map(u => `<option value="${u.id}"${u.id === ui.viewer ? ' selected' : ''}>${esc(u.id === 'me' ? '나 (기본)' : u.name + ' (예시 친구)')}</option>`).join('');
  }
  function renderSide() {
    const v = ui.viewer, fr = friendsOf(v);
    let h = '<div class="sheet-head"><h2 class="sh">친구와 설정</h2><button class="btn ghost sm" data-side-close>닫기</button></div>';
    const invites = S.diaries.filter(d => d.pending.includes(v));
    if (invites.length) {
      h += `<section class="card invite"><h2 class="sh">같이 올리기 초대</h2><ul class="inv">${invites.map(d => {
        const conflict = S.diaries.some(x => x.id !== d.id && x.date === d.date && x.owners.includes(v));
        return `<li><img src="${photoSrc(d.photo)}" alt=""><p><b>${esc(user(d.owners[0]).name)}</b>님이 ${dLabel(d.date)} 일기를 같이 올리자고 했어요.</p>${conflict ? '<p class="warn">이날 내 일기가 이미 있어요. 수락하면 이 사진으로 바뀌어요.</p>' : ''}<div class="row"><button class="btn sm" data-inv-accept="${d.id}">수락</button><button class="btn sm ghost" data-inv-decline="${d.id}">거절</button></div></li>`;
      }).join('')}</ul></section>`;
    }
    h += `<section class="card"><h2 class="sh">달력 고르기</h2><div class="who">`;
    [user(v), ...fr].forEach(u => { h += `<button class="who-btn${ui.owner === u.id ? ' on' : ''}" data-owner="${u.id}" aria-pressed="${ui.owner === u.id}">${avatar(u.id)}<span>${u.id === v ? '내 다이어리' : esc(u.name)}</span></button>`; });
    h += '</div></section>';
    const inc = S.requests.filter(r => r.to === v), out = S.requests.filter(r => r.from === v);
    h += '<section class="card"><h2 class="sh">친구</h2>';
    if (inc.length) h += `<p class="sub">받은 친구 신청</p><ul class="req">${inc.map(r => `<li>${avatar(r.from)}<span>${esc(user(r.from).name)}</span><button class="btn sm" data-accept="${r.from}">수락</button><button class="btn sm ghost" data-decline="${r.from}">거절</button></li>`).join('')}</ul>`;
    if (out.length) h += `<p class="sub">보낸 친구 신청</p><ul class="req">${out.map(r => `<li>${avatar(r.to)}<span>${esc(user(r.to).name)}</span><em>대기 중</em><button class="btn sm ghost" data-cancel="${r.to}">취소</button></li>`).join('')}</ul>`;
    if (!fr.length && !inc.length && !out.length) h += '<p class="hint">아직 친구가 없어요. 이름으로 친구 신청을 보내 보세요.</p>';
    h += `<form class="add" id="addFriend"><label class="sub" for="friendName">친구 추가</label><div class="add-row"><input type="text" id="friendName" placeholder="이름 입력" autocomplete="off"><button class="btn sm">신청</button></div><p class="hint" role="status">${esc(ui.friendMsg)}</p></form></section>`;
    h += `<section class="card"><h2 class="sh">일정 기본 공개</h2><select id="defPriv" aria-label="새 일정의 기본 공개 범위">${Object.entries(PRIV).map(([k, p]) => `<option value="${k}"${S.settings[v].defaultPrivacy === k ? ' selected' : ''}>${p.name}</option>`).join('')}</select><p class="hint">새 일정에 먼저 적용되고, 일정마다 바꿀 수 있어요.</p>`;
    h += `<ul class="legend"><li>${ICON.private}<span>비공개 · 친구에게 안 보여요</span></li><li>${ICON.bar}<span>막대만 공개 · 색 막대만 보여요</span></li><li>${ICON.public}<span>내용 공개 · 막대에 표시 없음</span></li></ul></section>`;
    h += '<section class="card plain"><button class="btn ghost sm" id="resetBtn">예시 데이터로 되돌리기</button></section>';

  }
  function renderToolbar() {
    const c = parse(ui.cursor);
    if (ui.view !== 'week') $('period').textContent = `${c.getFullYear()}년 ${c.getMonth() + 1}월`;
    else {
      const ws = addDays(ui.cursor, -c.getDay()), we = addDays(ws, 6), a = parse(ws), b = parse(we);
      $('period').textContent = a.getMonth() === b.getMonth() ? `${a.getMonth() + 1}월 ${a.getDate()}–${b.getDate()}일` : `${a.getMonth() + 1}.${a.getDate()} – ${b.getMonth() + 1}.${b.getDate()}`;
    }
    document.querySelectorAll('[data-view]').forEach(b => { b.classList.toggle('on', b.dataset.view === ui.view); b.setAttribute('aria-pressed', b.dataset.view === ui.view); });
    const isDiary = ui.view === 'diary';
    $('flipBtn').innerHTML = `<span class="ic">${isDiary ? CAM : CAL}</span>${isDiary ? '일기' : '달력'}${SWAP}`;
    $('flipBtn').setAttribute('aria-label', `지금 ${isDiary ? '일기' : '달력'} 보는 중. 누르면 ${isDiary ? '달력' : '일기'}로 바뀌어요`);
    document.querySelector('.seg').hidden = isDiary;
    const own = ui.owner === ui.viewer, name = esc(user(ui.owner).name);
    $('addBtn').hidden = !own;
    $('addBtn').textContent = ui.view === 'diary' ? '+ 오늘 일기' : '+ 일정 추가';
    $('mFlip').innerHTML = `${isDiary ? CAM : CAL}<span>${isDiary ? '일기' : '달력'} ⇄</span>`;
    $('mFlip').setAttribute('aria-label', `지금 ${isDiary ? '일기' : '달력'} 보는 중. 누르면 ${isDiary ? '달력' : '일기'}로 바뀌어요`);
    $('mAdd').setAttribute('aria-disabled', String(!own));
    const nBadge = S.requests.filter(r => r.to === ui.viewer).length + S.diaries.filter(d => d.pending.includes(ui.viewer)).length;
    $('mBadge').hidden = !nBadge; $('mBadge').textContent = nBadge;
    $('mSide').setAttribute('aria-label', nBadge ? `친구와 설정, 새 알림 ${nBadge}개` : '친구와 설정');
    let t;
    if (ui.view === 'diary') t = own ? '내 일기 · 빈 칸을 눌러 사진과 한 줄 일기를 올려요. 사진 위 연필 버튼을 누르면 일기가 보여요.' : `${name}님의 일기 · 친구 공개 일기만 보여요. 사진을 눌러 스티커를 붙여 보세요.`;
    else t = own ? '내 달력 · 빈 칸을 누르면 일정을 추가하고, 일정을 누르면 받은 스티커를 볼 수 있어요.' : `${name}님의 달력 · 공개된 일정만 보여요. 일정을 눌러 스티커를 붙여 보세요.`;
    $('ctx').innerHTML = `${avatar(ui.owner)}<span>${t}</span>`;
  }
  function render() {
    hideBubble();
    if (ui.owner !== ui.viewer && !areFriends(ui.owner, ui.viewer)) ui.owner = ui.viewer;
    renderViewerSel(); renderSide(); renderToolbar();
    const phone = isMobile();
    if (phone && ui.view === 'month') { const r = monthRange(); if (ui.sel < r.start || ui.sel > r.end) ui.sel = ui.cursor; }
    $('view').innerHTML = ui.view === 'month' ? renderMonth() + (phone ? dayBlock(ui.sel, 'agenda', dLabel(ui.sel)) : '')
      : ui.view === 'week' ? (phone ? renderWeekList() : renderWeek()) : renderDiary();
    if (ui.view === 'week' && ui.scrollWeek) { const b = $('wkBody'); if (b) b.scrollTop = 8 * HOUR - 10; }
    ui.scrollWeek = false;
  }

  /* ---------- Stickers (events and diaries) ---------- */
  const KIND = {
    ev: { list: () => S.events, owners: o => [o.owner], vis: o => level(o, ui.viewer) },
    dy: { list: () => S.diaries, owners: o => o.owners, vis: o => dLevel(o) }
  };
  const findIn = (kind, id) => KIND[kind].list().find(x => x.id === id);
  function stickerSection(kind, o) {
    const owners = KIND[kind].owners(o), own = owners.includes(ui.viewer);
    let h = `<div class="dt-stk"><h4>붙은 스티커${o.stickers.length ? ' ' + o.stickers.length + '개' : ''}</h4>`;
    if (o.stickers.length) {
      h += `<ul class="stk-list">${o.stickers.map(st => {
        const key = `${kind}|${o.id}|${st.by}`;
        return `<li class="${ui.fresh === key ? 'new' : ''}">${stkSVG(st.type, rot(o.id + st.by), 'stk lg')}<span>${esc(user(st.by).name)}${st.by === ui.viewer ? ' (나)' : ''}<small>${esc(stkName(st.type))}</small></span>${own ? `<button class="x" data-unstick="${key}">떼기</button>` : ''}</li>`;
      }).join('')}</ul>`;
    } else {
      const priv = kind === 'ev' ? o.privacy === 'private' : o.privacy === 'private';
      h += `<p class="empty">${own ? (priv ? '비공개라서 친구가 스티커를 붙일 수 없어요.' : '아직 받은 스티커가 없어요. 친구가 붙여 주면 여기에 모여요.') : '첫 번째 스티커를 붙여 보세요.'}</p>`;
    }
    if (!own) {
      const mine = o.stickers.find(s => s.by === ui.viewer), pk = S.theme.pack;
      h += `<h4>${mine ? '내 스티커 바꾸기' : '스티커 붙이기'} · ${esc(PACKS[pk].name)}</h4><div class="picker">${Object.entries(PACKS[pk].items).map(([k, it]) => {
        const t = `${pk}:${k}`, on = mine && normType(mine.type) === t;
        return `<button class="pk${on ? ' on' : ''}" data-stick="${kind}|${o.id}|${t}" aria-pressed="${!!on}">${stkSVG(t, 0, 'stk xl')}<span>${esc(it.name)}</span></button>`;
      }).join('')}</div>`;
      if (mine) h += `<button class="link" data-unstick="${kind}|${o.id}|${ui.viewer}">내 스티커 떼기</button>`;
      h += '<p class="hint">한 사람당 스티커 1개를 붙일 수 있어요. 스티커 묶음은 "꾸미기 설정"에서 바꿔요.</p>';
    }
    return h + '</div>';
  }
  function reopen(kind, id) { if (kind === 'ev') openDetail(id); else openDiary(id); }
  function stick(kind, id, type) {
    const o = findIn(kind, id); if (!o) return;
    if (KIND[kind].owners(o).includes(ui.viewer) || KIND[kind].vis(o) === 'none') return;
    const mine = o.stickers.find(s => s.by === ui.viewer);
    if (mine && normType(mine.type) === type) return;
    if (mine) mine.type = type; else o.stickers.push({ by: ui.viewer, type });
    ui.fresh = `${kind}|${id}|${ui.viewer}`;
    save(); render(); reopen(kind, id); toast(`${stkName(type)} 스티커를 붙였어요`);
  }
  function unstick(kind, id, by) {
    const o = findIn(kind, id); if (!o) return;
    if (by !== ui.viewer && !KIND[kind].owners(o).includes(ui.viewer)) return;
    o.stickers = o.stickers.filter(s => s.by !== by);
    save(); render(); reopen(kind, id); toast('스티커를 뗐어요');
  }

  /* ---------- Event detail ---------- */
  function whenText(e) {
    if (e.start === e.end) return dLabel(e.start) + (e.allDay ? ' · 하루 종일' : ` · ${e.startTime}–${e.endTime}`);

  }
  function showDetail(html) {

    if (!$('dlgDetail').open) $('dlgDetail').showModal();
  }
  function openDetail(id) {
    const e = S.events.find(x => x.id === id); if (!e) return;
    const lv = level(e, ui.viewer); if (lv === 'none') return;
    const own = e.owner === ui.viewer;

    showDetail(h);
  }

  /* ---------- Diary detail ---------- */
  function openDiary(id) {
    const d = S.diaries.find(x => x.id === id); if (!d || dLevel(d) === 'none') return;
    hideBubble();
    const own = d.owners.includes(ui.viewer);

    h += `<p class="dt-owner"><span class="avs">${d.owners.map(avatar).join('')}</span><span>${names}${d.owners.length > 1 ? ' · 함께 올림' : ''} · ${dLabel(d.date)}</span></p>`;
    const lines = d.owners.filter(o => d.texts[o]).map(o => `<p>${avatar(o)}<span>${esc(d.texts[o])}</span></p>`).join('');

    if (own) {
      h += `<p class="dt-priv">${ICON[d.privacy === 'private' ? 'private' : 'public']}<span><b>${d.privacy === 'private' ? '비공개' : '친구 공개'}</b>${d.pending.length ? ` · 초대 대기 중: ${d.pending.map(p => esc(user(p).name)).join(', ')}` : ''}</span></p>`;
    }
    h += stickerSection('dy', d);
    h += `<div class="dlg-actions">${own ? `<button class="btn ghost" data-dedit="${d.id}">${d.owners[0] === ui.viewer ? '수정' : '내 문장 쓰기'}</button>` : ''}<button class="btn" data-close>닫기</button></div>`;
    showDetail(h);
  }

  /* ---------- Event form ---------- */
  $('swatches').innerHTML = Object.entries(COLORS).map(([k, [n, c]]) => `<input type="radio" name="fColor" id="c-${k}" value="${k}"><label for="c-${k}" style="--c:${c}" title="${n}"><span class="sr">${n}</span></label>`).join('');
  const PV = { private: '<span class="pv"></span>', bar: '<span class="pv fill"></span>', public: '<span class="pv fill">14:00 도서관</span>' };
  $('privs').innerHTML = Object.entries(PRIV).map(([k, p]) => `<input type="radio" name="fPriv" id="p-${k}" value="${k}"><label for="p-${k}"><b>${p.name}</b><small>${p.desc}</small>${PV[k]}</label>`).join('');
  const setRadio = (name, v) => { const el = document.querySelector(`input[name="${name}"][value="${v}"]`); if (el) el.checked = true; };
  const getRadio = name => (document.querySelector(`input[name="${name}"]:checked`) || {}).value;

  $('fAllDay').addEventListener('change', syncTime);
  $('fStart').addEventListener('change', () => { if (!$('fEnd').value || $('fEnd').value < $('fStart').value) $('fEnd').value = $('fStart').value; });

  function openForm(id, date, hour) {
    const e = id ? S.events.find(x => x.id === id) : null;
    $('formTitle').textContent = e ? '일정 수정' : '새 일정';

    setRadio('fPriv', e ? e.privacy : S.settings[ui.viewer].defaultPrivacy);
    $('fMemo').value = e ? e.memo : '';
    $('btnDelete').hidden = !e; disarm($('btnDelete'), '삭제');
    $('formMsg').textContent = '';
    syncTime();
    if ($('dlgDetail').open) $('dlgDetail').close();
    $('dlgForm').showModal();
    $('fTitle').focus();
  }
  $('formEl').addEventListener('submit', ev => {
    ev.preventDefault();
    const title = $('fTitle').value.trim(), s = $('fStart').value, en = $('fEnd').value || s, allDay = $('fAllDay').checked;
    const msg = t => { $('formMsg').textContent = t; };
    if (!title) return msg('제목을 입력해 주세요.');
    if (!s) return msg('시작 날짜를 골라 주세요.');
    if (en < s) return msg('끝 날짜가 시작 날짜보다 빨라요. 날짜를 확인해 주세요.');
    if (!allDay && (!$('fStartTime').value || !$('fEndTime').value)) return msg('시작 시간과 끝 시간을 입력하거나 "하루 종일"을 선택해 주세요.');
    if (!allDay && s === en && $('fEndTime').value <= $('fStartTime').value) return msg('끝 시간이 시작 시간보다 늦어야 해요.');
    const data = { title, start: s, end: en, allDay, startTime: allDay ? '' : $('fStartTime').value, endTime: allDay ? '' : $('fEndTime').value, color: getRadio('fColor') || 'mint', privacy: getRadio('fPriv') || 'bar', memo: $('fMemo').value.trim() };
    if ($('fId').value) { Object.assign(S.events.find(x => x.id === $('fId').value), data); toast('일정을 수정했어요'); }
    else { S.events.push(Object.assign({ id: newId('e'), owner: ui.viewer, stickers: [] }, data)); toast('일정을 추가했어요'); }
    save(); $('dlgForm').close(); render();
  });
  const armTimers = new WeakMap();
  function disarm(b, label) { clearTimeout(armTimers.get(b)); b.classList.remove('armed'); b.textContent = label; }
  function armed(b, label, armedLabel) {
    if (b.classList.contains('armed')) return true;
    b.classList.add('armed'); b.textContent = armedLabel;
    armTimers.set(b, setTimeout(() => disarm(b, label), 4000));
    return false;
  }
  $('btnDelete').addEventListener('click', () => {
    if (!armed($('btnDelete'), '삭제', '한 번 더 누르면 삭제돼요')) return;
    S.events = S.events.filter(x => x.id !== $('fId').value);
    save(); $('dlgForm').close(); render(); toast('일정을 삭제했어요');
  });

  /* ---------- Diary form ---------- */
  function setPreview(src) {
    $('dPrev').hidden = !src; if (src) $('dPrev').src = src;
    $('dPh').hidden = !!src; $('dChg').hidden = !src || $('dPhoto').disabled;
  }
  function openDiaryForm(id, date) {
    const d = id ? S.diaries.find(x => x.id === id) : null;
    const isAuthor = !d || d.owners[0] === ui.viewer;
    ui.dForm = { id: d ? d.id : null, date: d ? d.date : date, photo: d ? d.photo : null, isAuthor };
    $('dTitle').textContent = `${dLabel(ui.dForm.date)} 일기`;
    $('dPhoto').value = ''; $('dPhoto').disabled = !isAuthor;
    $('dPhotoHint').hidden = isAuthor;
    setPreview(d ? photoSrc(d.photo) : '');
    $('dText').value = d ? (d.texts[ui.viewer] || '') : '';
    $('dCount').textContent = `${$('dText').value.length} / 40`;
    setRadio('dPriv', d ? d.privacy : 'friends');
    $('dPrivWrap').hidden = !isAuthor; $('dCoWrap').hidden = !isAuthor;
    const fr = friendsOf(ui.viewer);
    $('dCo').innerHTML = fr.length ? fr.map(u => {
      const joined = d && d.owners.includes(u.id), pend = d && d.pending.includes(u.id);
      return `<label class="co"><input type="checkbox" value="${u.id}"${joined || pend ? ' checked' : ''}${joined ? ' disabled' : ''}>${avatar(u.id)}${esc(u.name)}${joined ? '<em>함께 올림</em>' : pend ? '<em>초대 대기 중</em>' : ''}</label>`;
    }).join('') : '<p class="hint">친구를 추가하면 같이 올릴 수 있어요.</p>';
    $('dDel').hidden = !d; disarm($('dDel'), isAuthor ? '일기 삭제' : '함께 올리기에서 빠지기');
    $('dMsg').textContent = '';
    if ($('dlgDetail').open) $('dlgDetail').close();
    $('dlgDiary').showModal();
  }
  $('dText').addEventListener('input', () => { $('dCount').textContent = `${$('dText').value.length} / 40`; });
  function resizeImage(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const max = 720, sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('read')); };
      img.src = url;
    });
  }
  $('dPhoto').addEventListener('change', async () => {
    const f = $('dPhoto').files[0]; if (!f) return;
    if (!f.type.startsWith('image/')) { $('dMsg').textContent = '사진 파일(JPG, PNG 등)만 올릴 수 있어요.'; return; }
    try { ui.dForm.photo = await resizeImage(f); setPreview(ui.dForm.photo); $('dMsg').textContent = ''; }
    catch (e) { $('dMsg').textContent = '이 사진을 읽지 못했어요. 다른 사진을 골라 주세요.'; }
  });
  $('diaryEl').addEventListener('submit', ev => {
    ev.preventDefault();
    const f = ui.dForm; if (!f) return;
    if (!f.photo) { $('dMsg').textContent = '사진을 골라 주세요.'; return; }
    const backup = JSON.stringify(S);
    const text = $('dText').value.trim();
    const picked = [...$('dCo').querySelectorAll('input:checked:not(:disabled)')].map(i => i.value);
    let d;
    if (f.id) {
      d = S.diaries.find(x => x.id === f.id);
      if (f.isAuthor) { d.photo = f.photo; d.privacy = getRadio('dPriv') || 'friends'; d.pending = picked.filter(p => !d.owners.includes(p)); }
      d.texts[ui.viewer] = text;
    } else {
      d = { id: newId('d'), date: f.date, owners: [ui.viewer], pending: picked, photo: f.photo, texts: { [ui.viewer]: text }, privacy: getRadio('dPriv') || 'friends', stickers: [] };
      S.diaries.push(d);
    }
    if (!save()) { S = JSON.parse(backup); $('dMsg').textContent = '브라우저 저장 공간이 가득 찼어요. 다른 일기 사진을 지운 뒤 다시 저장해 주세요.'; return; }
    $('dlgDiary').close(); render();
    toast(picked.length && f.isAuthor ? `일기를 올리고 ${picked.map(p => user(p).name).join(', ')}님에게 같이 올리기를 요청했어요` : '일기를 저장했어요');
  });
  $('dDel').addEventListener('click', () => {
    const f = ui.dForm; if (!f || !f.id) return;
    const label = f.isAuthor ? '일기 삭제' : '함께 올리기에서 빠지기';
    if (!armed($('dDel'), label, '한 번 더 누르면 적용돼요')) return;
    if (f.isAuthor) { S.diaries = S.diaries.filter(x => x.id !== f.id); toast('일기를 삭제했어요'); }
    else { const d = S.diaries.find(x => x.id === f.id); d.owners = d.owners.filter(o => o !== ui.viewer); delete d.texts[ui.viewer]; toast('함께 올리기에서 빠졌어요'); }
    save(); $('dlgDiary').close(); render();
  });
  function acceptInvite(id) {
    const v = ui.viewer, d = S.diaries.find(x => x.id === id); if (!d) return;
    S.diaries.filter(x => x.id !== d.id && x.date === d.date && x.owners.includes(v)).forEach(x => {
      if (x.owners.length === 1) S.diaries = S.diaries.filter(y => y.id !== x.id);
      else { x.owners = x.owners.filter(o => o !== v); delete x.texts[v]; }
    });
    d.pending = d.pending.filter(p => p !== v); d.owners.push(v); d.texts[v] = d.texts[v] || '';
    save(); ui.view = 'diary'; ui.owner = v; ui.cursor = d.date; render();
    toast('같이 올렸어요. 사진을 눌러 내 문장을 써 보세요');
  }

  /* ---------- Settings ---------- */
  function tplPreview(t) {
    const dark = lum(t.paper) < .2, pc = patternCSS(t.pattern, mix(t.paper, t.ink, .17), t.accent);
    const pk = PACKS[t.pack], keys = Object.keys(pk.items).slice(0, 3);
    return `<span class="sw" style="background-color:${t.paper};background-image:${pc.img.replace(/"/g, "'")};background-size:${pc.size};color:${t.ink}"><span class="s" style="font-family:'${t.font}',cursive">11월${dark ? ' ✦' : ''}</span><span class="mini">${keys.map(k => stkSVG(t.pack + ':' + k, rot(k))).join('')}</span><span class="ac" style="background:${t.accent};position:absolute;left:8px;top:8px"></span></span>`;
  }
  function renderSettings() {
    const t = S.theme;
    let h = '<h3 id="setTitle">꾸미기 설정</h3>';
    h += `<div class="set-sec"><h4>템플릿</h4><div class="tpl-grid">${Object.entries(PRESETS).map(([k, p]) => `<button class="tpl${!t.custom && t.preset === k ? ' on' : ''}" data-preset="${k}" aria-pressed="${!t.custom && t.preset === k}">${tplPreview(p)}<span class="nm">${p.name}</span></button>`).join('')}</div>${t.custom ? '<p class="hint">지금은 직접 고른 설정을 쓰고 있어요. 템플릿을 누르면 그 템플릿으로 바뀌어요.</p>' : ''}</div>`;
    h += '<div class="set-sec"><h4>직접 고르기</h4>';
    h += `<p class="sub">배경 무늬</p><div class="chips">${Object.entries(PATTERNS).map(([k, n]) => {
      const pc = patternCSS(k, mix(t.paper, t.ink, .25), t.accent);
      return `<button class="chip${t.pattern === k ? ' on' : ''}" data-pattern="${k}" aria-pressed="${t.pattern === k}"><span class="pt" style="background-color:${t.paper};background-image:${pc.img.replace(/"/g, "'")};background-size:${pc.size}"></span>${n}</button>`;
    }).join('')}</div>`;
    const colorRow = (key, list, label) => `<p class="sub">${label}</p><div class="colors">${list.map(c => `<button class="cdot${t[key].toLowerCase() === c ? ' on' : ''}" style="--c:${c}" data-color="${key}|${c}" aria-label="${label} ${c}" aria-pressed="${t[key].toLowerCase() === c}"></button>`).join('')}<input type="color" id="pick-${key}" value="${t[key]}" aria-label="${label} 직접 고르기"></div>`;
    h += colorRow('paper', PAPER_CHOICES, '배경 색');
    h += `<p class="sub">글씨체</p><div class="chips">${FONTS.map(f => `<button class="chip font${t.font === f ? ' on' : ''}" data-font="${f}" style="font-family:'${f}',cursive" aria-pressed="${t.font === f}">다이어리 11월</button>`).join('')}</div>`;
    h += colorRow('ink', INK_CHOICES, '글자 색');
    h += colorRow('accent', ACCENT_CHOICES, '강조 색');
    h += '</div>';
    h += `<div class="set-sec"><h4>스티커 묶음</h4><div class="packs">${Object.entries(PACKS).map(([k, p]) => `<button class="pack${t.pack === k ? ' on' : ''}" data-pack="${k}" aria-pressed="${t.pack === k}"><span class="nm">${p.name}</span><span class="row">${Object.keys(p.items).map(i => stkSVG(k + ':' + i, rot(k + i))).join('')}</span></button>`).join('')}</div><p class="hint">친구에게 스티커를 붙일 때 고른 묶음의 스티커가 나와요. 이미 붙인 스티커는 그대로 남아요.</p></div>`;
    h += '<div class="dlg-actions"><button class="btn ghost" data-preset="dot">처음 모습으로</button><span class="spacer"></span><button class="btn" data-close>닫기</button></div>';
    $('setBody').innerHTML = h;
  }
  function setTheme(patch, isPreset) {
    if (isPreset) S.theme = Object.assign({ preset: patch, custom: false }, PRESETS[patch]);
    else { Object.assign(S.theme, patch); if (!('pack' in patch && Object.keys(patch).length === 1)) S.theme.custom = true; }
    applyTheme(); save(); renderSettings(); render();
  }

  /* ---------- Friends ---------- */
  function addFriend(name) {
    const v = ui.viewer, target = S.users.find(u => u.name === name && u.id !== v);
    const others = S.users.filter(u => u.id !== v && !areFriends(v, u.id)).map(u => u.name);
    if (!name) ui.friendMsg = '친구 이름을 입력해 주세요.';
    else if (!target) ui.friendMsg = `"${name}"님을 찾지 못했어요. 시제품에서는 예시 사용자만 찾을 수 있어요${others.length ? ': ' + others.join(', ') : ''}.`;
    else if (areFriends(v, target.id)) ui.friendMsg = `${target.name}님과는 이미 친구예요.`;
    else if (S.requests.some(r => r.from === target.id && r.to === v)) ui.friendMsg = `${target.name}님이 먼저 신청했어요. 위에서 수락해 주세요.`;
    else if (S.requests.some(r => r.from === v && r.to === target.id)) ui.friendMsg = `${target.name}님에게 이미 신청했어요.`;
    else { S.requests.push({ from: v, to: target.id }); ui.friendMsg = `${target.name}님에게 신청을 보냈어요. 위쪽 "이 사람으로 보기"에서 ${target.name}님으로 바꾸면 수락해 볼 수 있어요.`; save(); }
    render();
    const inp = $('friendName'); if (inp) inp.focus();
  }

  /* ---------- Navigation ---------- */
  function nav(dir) {
    if (dir === 0) ui.cursor = today;
    else if (ui.view !== 'week') { const c = parse(ui.cursor); ui.cursor = toStr(new Date(c.getFullYear(), c.getMonth() + dir, 1)); }
    else ui.cursor = addDays(ui.cursor, 7 * dir);
    ui.sel = dir === 0 ? today : ui.cursor;
    ui.scrollWeek = true; render();
  }
  function openSide() { document.body.classList.add('side-open'); $('scrim').hidden = false; }
  function closeSide() { document.body.classList.remove('side-open'); $('scrim').hidden = true; }
  let toastTimer = 0;
  function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200); }

  /* ---------- Events ---------- */
  document.addEventListener('click', ev => {
    const t = ev.target, q = sel => t.closest(sel);
    let el;
    if ((el = q('[data-pen]'))) { const id = el.dataset.pen; if (ui.bubble === id) hideBubble(); else showBubble(id, el); return; }
    if (!q('#bubble')) hideBubble();
    if ((el = q('[data-close]'))) { el.closest('dialog').close(); return; }
    if ((el = q('[data-preset]'))) { setTheme(el.dataset.preset, true); return; }
    if ((el = q('[data-pattern]'))) { setTheme({ pattern: el.dataset.pattern }); return; }
    if ((el = q('[data-font]'))) { setTheme({ font: el.dataset.font }); return; }
    if ((el = q('[data-color]'))) { const [k, c] = el.dataset.color.split('|'); setTheme({ [k]: c }); return; }
    if ((el = q('[data-pack]'))) { setTheme({ pack: el.dataset.pack }); toast(`${PACKS[el.dataset.pack].name} 스티커 묶음으로 바꿨어요`); return; }
    if ((el = q('[data-stick]'))) { const [k, id, ty] = el.dataset.stick.split('|'); stick(k, id, ty); return; }
    if ((el = q('[data-unstick]'))) { const [k, id, by] = el.dataset.unstick.split('|'); unstick(k, id, by); return; }
    if ((el = q('[data-edit]'))) { openForm(el.dataset.edit); return; }
    if ((el = q('[data-dedit]'))) { openDiaryForm(el.dataset.dedit); return; }
    if ((el = q('[data-ev]'))) { openDetail(el.dataset.ev); return; }
    if ((el = q('[data-diary]'))) { openDiary(el.dataset.diary); return; }
    if ((el = q('[data-dadd]'))) { openDiaryForm(null, el.dataset.dadd); return; }
    if ((el = q('[data-inv-accept]'))) { acceptInvite(el.dataset.invAccept); return; }
    if ((el = q('[data-inv-decline]'))) { const d = S.diaries.find(x => x.id === el.dataset.invDecline); if (d) { d.pending = d.pending.filter(p => p !== ui.viewer); save(); render(); toast('같이 올리기를 거절했어요'); } return; }
    if ((el = q('[data-more]'))) { ui.view = 'week'; ui.cursor = el.dataset.more; ui.scrollWeek = true; render(); return; }
    if ((el = q('[data-nav]'))) { nav(+el.dataset.nav); return; }
    if ((el = q('[data-view]'))) { ui.view = el.dataset.view; ui.calView = ui.view; ui.scrollWeek = true; render(); return; }
    if (q('#flipBtn') || q('#mFlip')) {
      if (ui.view === 'diary') { ui.view = ui.calView || 'month'; ui.scrollWeek = true; }
      else ui.view = 'diary';
      render(); return;
    }
    if (q('#mAdd')) {
      if (ui.owner !== ui.viewer) { toast('내 다이어리에서만 추가할 수 있어요'); return; }
      if (ui.view === 'diary') { const mine = S.diaries.find(d => d.date === today && d.owners.includes(ui.viewer)); openDiaryForm(mine ? mine.id : null, today); }
      else openForm(null, ui.view === 'month' ? ui.sel : ui.cursor);
      return;
    }
    if (q('#mSide')) { openSide(); return; }
    if (q('#mSet')) { renderSettings(); $('dlgSet').showModal(); return; }
    if (q('[data-side-close]') || t.id === 'scrim') { closeSide(); return; }
    if ((el = q('[data-addon]'))) { openForm(null, el.dataset.addon); return; }
    if ((el = q('[data-owner]'))) { ui.owner = el.dataset.owner; closeSide(); render(); return; }
    if ((el = q('[data-accept]'))) {
      const from = el.dataset.accept; S.requests = S.requests.filter(r => !(r.from === from && r.to === ui.viewer));
      S.friends.push([ui.viewer, from]); ui.friendMsg = ''; save(); render(); toast(`${user(from).name}님과 친구가 되었어요`); return;
    }
    if ((el = q('[data-decline]'))) { const from = el.dataset.decline; S.requests = S.requests.filter(r => !(r.from === from && r.to === ui.viewer)); save(); render(); toast('친구 신청을 거절했어요'); return; }
    if ((el = q('[data-cancel]'))) { const to = el.dataset.cancel; S.requests = S.requests.filter(r => !(r.from === ui.viewer && r.to === to)); save(); render(); toast('친구 신청을 취소했어요'); return; }
    if (q('#setBtn')) { renderSettings(); $('dlgSet').showModal(); return; }
    if (t.id === 'addBtn') {
      if (ui.view === 'diary') { const mine = S.diaries.find(d => d.date === today && d.owners.includes(ui.viewer)); openDiaryForm(mine ? mine.id : null, today); }
      else openForm(null, ui.cursor);
      return;
    }
    if (t.id === 'resetBtn') {
      if (!armed(t, '예시 데이터로 되돌리기', '한 번 더 누르면 처음 상태로 돌아가요')) return;
      S = seed(); ui.viewer = 'me'; ui.owner = 'me'; ui.friendMsg = ''; save(); applyTheme(); render(); toast('예시 데이터로 되돌렸어요'); return;
    }
    if (isMobile() && (el = q('.month .day'))) { ui.sel = el.dataset.date; render(); return; }
    if (ui.owner !== ui.viewer) return;
    if ((el = q('.month .day'))) { openForm(null, el.dataset.date); return; }
    if ((el = q('.wk .col'))) {
      const r = el.getBoundingClientRect(), hour = Math.max(0, Math.min(23, Math.floor((ev.clientY - r.top) / HOUR)));
      openForm(null, el.dataset.date, hour);
    }
  });
  document.addEventListener('submit', ev => { if (ev.target.id === 'addFriend') { ev.preventDefault(); addFriend($('friendName').value.trim()); } });
  document.addEventListener('input', ev => {
    const m = ev.target.id && ev.target.id.match(/^pick-(paper|ink|accent)$/);
    if (m) { Object.assign(S.theme, { [m[1]]: ev.target.value, custom: true }); applyTheme(); }
  });
  document.addEventListener('change', ev => {
    const t = ev.target;
    if (t.id === 'viewerSel') { ui.viewer = t.value; ui.owner = ui.viewer; ui.friendMsg = ''; render(); toast(ui.viewer === 'me' ? '나로 보고 있어요' : `${user(ui.viewer).name}님으로 보고 있어요`); }
    if (t.id === 'defPriv') { S.settings[ui.viewer].defaultPrivacy = t.value; save(); toast(`기본 공개 설정: ${PRIV[t.value].name}`); }
    if (/^pick-(paper|ink|accent)$/.test(t.id)) { save(); renderSettings(); render(); }
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { hideBubble(); closeSide(); } });
  window.addEventListener('scroll', hideBubble, { passive: true });
  ['dlgDetail', 'dlgForm', 'dlgDiary', 'dlgSet'].forEach(id => $(id).addEventListener('click', ev => { if (ev.target === $(id)) $(id).close(); }));
  let lastSmall = isMobile();
  window.addEventListener('resize', () => { hideBubble(); const s = isMobile(); if (s !== lastSmall) { lastSmall = s; if (!s) closeSide(); render(); } });

  buildStickers();
  applyTheme();
  render();
})();
</script>
</body>
</html>
